name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Node.js 20 (Required for latest Expo)

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps # Bypasses strict peer dependency checks

      - name: 🏗️ Expo Prebuild (Generate Native Android Code)
        run: npx expo prebuild --platform android --clean

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔐 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRCTC-God-Mode-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
