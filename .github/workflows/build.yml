name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to run the build manually from GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Expo Prebuild (Generate Native Android Code)
        # This is the most critical step. It triggers your custom config plugin
        # (withIRCTCAutomator.js) to write the Java/XML files into the android folder.
        run: npx expo prebuild --platform android --clean

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # React Native 0.74 requires Java 17

      - name: 🔐 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRCTC-God-Mode-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
